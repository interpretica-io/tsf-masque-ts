# The engine and the agent are built for the same platform: the agent
# runs on the engine host. The data plane (tapi_masque) drives the
# agent's QUIC backend over RPCs, and the control plane (tapi_cfg_masque)
# drives the /agent/masque Configurator subtree; the onwire group drives
# TAD. So the platform carries the full RPC, Configurator and TAD stacks.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external library under test. Its reference lives in
# conf/external.yml and the commit actually built in
# conf/builder.conf.lock. ta_masque and rpcs_masque bind onto the agent
# (listed again in the RPC server application below), tapi_cfg_masque and
# tapi_masque onto the engine.
TE_EXT_REPO_USE([tsf_masque], [],
                [ta_masque rpcs_masque tapi_masque])

# The masque_* RPCs. The platform is shared by engine and agent, so one
# declaration wires rpcxdr (engine) and rpcxdrta (agent) both. See
# ta_masque/masque_rpc.x.m4.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_masque/masque_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# TAD restricted to the protocols the onwire group needs (eth/ip4/udp);
# without this the meson build pulls the full default set, which includes
# SNMP and is unsupported under meson.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application. tapi_masque's RPCs run here, so it links the
# agent-side ta_masque (the session engine, the quiche/msquic backends and
# the masque_* RPC data plane) and rpcs_masque on top of the stock RPC
# server. The agent host must carry a QUIC backend (libquiche and/or
# libmsquic with their headers); the build image provides both. When
# neither is present the /agent/masque tree still works and the data-plane
# tests skip.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_masque rpcs_masque \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8 quiche libmsquic'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
